<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Tombol</title>

    <style>
        /* 1. Pengaturan halaman */
        body {
        background-color: #f5f5f5;
        font-family: Arial, sans-serif;
        }

        /* 2. Judul bagian */
        h2 {
        color: navy;
        font-size: 20px;
        }

        /* 3. Gaya umum semua tombol */
        .btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: bold;
        text-decoration: none;
        }

        /* 4. Jarak antar tombol */
        .button-group .btn {
        margin-right: 10px;
        margin-bottom: 10px;
        }

        /* 5. Warna setiap tombol */
        .btn-primary {
        background-color: rgb(52, 152, 219);
        color: white;
        }

        .btn-secondary {
        background-color: rgba(255, 193, 7, 0.9);
        }

        .btn-outline {
        background-color: white;
        border: 2px solid #333333;
        }

        .btn-send {
        background-color: seagreen;
        color: white;
        }

        /* 6. Selector grouping */
        .btn-secondary,
        .btn-outline {
        color: #222222;
        }

        /* 7. Efek hover */
        .btn-primary:hover {
        background-color: #1f618d;
        }

        .btn-secondary:hover {
        background-color: rgba(255, 193, 7, 1);
        }

        .btn-outline:hover {
        background-color: rgb(220, 220, 220);
        }

        .btn-send:hover {
        background-color: darkred;
        }
    </style>
</head>
<body>

    <main>
        <h2>Kumpulan Tombol</h2>

        <div class="button-group">
            <a href="/components/card.html" class="btn btn-primary">Lihat Proyek</a>
            <a href="#" class="btn btn-secondary">Unduh CV</a>
            <a href="/pages/Contact.html" class="btn btn-outline">Hubungi Saya</a>
            <a href="/pages/Contact.html" class="btn btn-send">Kirim Pesan</a>
        </div>
    </main>

    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
