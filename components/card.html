<!--
Perhitungan lebar kartu jika box-sizing tidak diatur:
320px + 20px padding kiri + 20px padding kanan
+ 2px border kiri + 2px border kanan = 364px
-->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #cccccc;
            margin: 30px auto;
            background-color: white;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
        }

        .card h3 {
            color: #333333;
            margin-bottom: 8px;
        }

        .card p {
            font-size: 15px;
        }

        .card a {
            color: #0077cc;
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <img src="/Asset/Images/ArtCreativity.png"
                 alt="Foto Proyek">

            <h3>Proyek Membuat Logo</h3>

            <p>
                Saya membuat logo Art&Creativity untuk melatih pembuatan web, di buat dengan html
            </p>

            <a href="/components/card-badge.html">Lihat Proyek</a>
        </div>
    </main>

    <footer style="text-align: center">
        <a href="/components/Button-set.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
